<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Ömer Doğan — native Mac apps and Claude Code tools">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(20,22,27,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0" stop-color="#c98a00" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c98a00" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="16" fill="#f5f2ea"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>
  <text x="72" y="92" class="mono" font-size="20" letter-spacing="2" fill="#c98a00">FALCON SOFTWARE</text>
  <text x="70" y="178" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="#14161b">Ömer Doğan</text>
  <text x="72" y="228" class="sans" font-size="26" fill="#5c584f">I build native Mac apps and tools for Claude Code.</text>
  <text x="72" y="276" class="mono" font-size="20" fill="#5c584f"><tspan fill="#c98a00">$</tspan> brew install --cask falconsw/tap/folderpad<tspan class="caret" fill="#c98a00"> ▍</tspan></text>
</svg>
